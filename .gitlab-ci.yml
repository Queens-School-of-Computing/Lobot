default:
  image:
    name: lobot-runner:latest
    pull_policy: if-not-present

workflow:
  rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: $CI_PIPELINE_SOURCE == "trigger"
      - if: $CI_PIPELINE_SOURCE == "api"

include:
  - local: '.gitlab/workflows/check-python-formatting.yml'
  - local: '.gitlab/workflows/update-configs.yml'
