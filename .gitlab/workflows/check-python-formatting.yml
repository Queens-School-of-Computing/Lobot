stages:
  - stage
  - check
  - test

get_changed_py_files:
  stage: stage
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
  script: |
    set -vx

    echo "CI_MERGE_REQUEST_DIFF_BASE_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA"
    echo "CI_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    echo "CI_MERGE_REQUEST_TARGET_BRANCH_SHA: $CI_MERGE_REQUEST_TARGET_BRANCH_SHA"
    echo "CI_MERGE_REQUEST_TITLE: $CI_MERGE_REQUEST_TITLE"
    echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

    TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    SOURCE_BRANCH=$CI_COMMIT_REF_NAME

    echo "Checking for python files changed '${SOURCE_BRANCH}' and '${TARGET_BRANCH}'..."
    git fetch origin $TARGET_BRANCH $SOURCE_BRANCH --depth 1
    git switch $SOURCE_BRANCH

    revision_range="origin/${TARGET_BRANCH}..origin/${SOURCE_BRANCH}"
    files=$(git diff --name-only --no-commit-id $revision_range)
    py_files=$(echo -n $files | xargs -n1 echo |grep \\.py\$)
    if [ -n "$py_files" ]
    then
      echo "$py_files" > changed-python-files.txt
    else
      echo "No python files changed"
    fi
  artifacts:
    paths:
      - ./changed-python-files.txt

ruff_check_py_files:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
  image: python:3.12

  script:
    - |-
      if [[ ! -f ./changed-python-files.txt ]]
      then
        echo "No python files to check"
        exit 0
      fi

      CHANGED_FILES=$(cat ./changed-python-files.txt)

      pip install ruff

    - |-
      echo "Checking python syntax ..."
      ruff check ${CHANGED_FILES}

    - |-
      echo "Checking python format ..."
      ruff format --check --diff ${CHANGED_FILES}

